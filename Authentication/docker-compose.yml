services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_dev
    ports: 
      - "5433:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports: 
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata: